<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD CHAMPIONSHIP - Ayinler_tech</title>
<style>
body{margin:0;background:#050510;color:white;font-family:Arial;text-align:center}
.top{background:linear-gradient(90deg,#00ff88,#0088ff);padding:30px;color:black}
.box{max-width:450px;margin:20px auto;background:#14142a;padding:20px;border-radius:15px;border:1px solid #333}
input{width:95%;padding:13px;margin:8px 0;border-radius:10px;border:none;background:#222;color:white}
button{width:97%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:6px 0}
.b1{background:#00ff88}.b2{background:white}.wa{position:fixed;bottom:20px;right:15px;background:#25D366;color:white;padding:12px 18px;border-radius:30px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="top">
<h1>🌍 WORLD CHAMPIONSHIP</h1>
<p>By <b>Ayinler_tech</b></p>
<p>Prize: <b>$5,000</b> | Opay: <b>8034437631</b></p>
<a href="https://wa.me/2348034437631"><button style="background:black;color:#00ff88;padding:10px 20px;border-radius:20px;border:none;font-weight:bold">💬 WhatsApp: 2348034437631</button></a>
</div>

<div class="box" id="authBox">
<h2>Login / Register</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="game" type="text" placeholder="Game you play e.g PUBG">
<button class="b1" onclick="register()">REGISTER</button>
<button class="b2" onclick="login()">LOGIN - ENTER NOW</button>
<p id="msg" style="color:#ff6666"></p>
</div>

<div class="box" id="payBox" style="display:none">
<h2>💳 Pay ₦5,000 to Compete</h2>
<div style="background:black;padding:12px;border-radius:10px">
OPAY: <b style="color:#00ff88;font-size:20px">8034437631</b><br>Ayinler_tech
</div>
<button class="b1" onclick="paid()">I HAVE PAID ✅</button>
<p>Status: <b id="status">Not Paid</b></p>
<p id="payMsg" style="color:#00ff88"></p>
<a id="arena" style="display:none" href="https://wa.me/2348034437631?text=Approve%20me"><button style="background:gold;padding:14px;border:none;border-radius:10px;width:100%;font-weight:bold">🔥 ENTER ARENA</button></a>
<br><br>
<button class="b2" onclick="logout()">Logout</button>
</div>

<a class="wa" href="https://wa.me/2348034437631">💬</a>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// PASTE YOUR FIREBASE CONFIG THAT WAS WORKING BEFORE - THIS IS WHY IT WAS NOT ENTERING
const firebaseConfig = {
  apiKey: "PASTE_OLD_API_KEY_HERE",
  authDomain: "PASTE_OLD.firebaseapp.com",
  projectId: "PASTE_OLD_ID",
  storageBucket: "PASTE_OLD.appspot.com",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = async ()=>{
  try{
    const c = await createUserWithEmailAndPassword(auth, email.value.trim(), password.value);
    await setDoc(doc(db,"players",c.user.uid),{email:email.value, game:game.value, paymentStatus:"Not Paid", time:Date.now()});
    msg.innerText="Success! Now click LOGIN";
  }catch(e){ msg.innerText=e.message }
}
window.login = async ()=>{
  try{ await signInWithEmailAndPassword(auth, email.value.trim(), password.value) }catch(e){ msg.innerText=e.message }
}
window.logout = ()=> signOut(auth);
window.paid = async ()=>{
  const u=auth.currentUser;
  await updateDoc(doc(db,"players",u.uid),{paymentStatus:"Pending"});
  payMsg.innerText="Done! Chat Ayinler_tech on WhatsApp to approve you";
  status.innerText="Pending Verification";
}

onAuthStateChanged(auth, async(user)=>{
  if(user){
    authBox.style.display="none"; payBox.style.display="block";
    const s = await getDoc(doc(db,"players",user.uid));
    if(s.exists()){
      status.innerText=s.data().paymentStatus;
      if(s.data().paymentStatus=="Approved") arena.style.display="block";
    }
  }else{ authBox.style.display="block"; payBox.style.display="none"; }
});
</script>
</body>
</html>
